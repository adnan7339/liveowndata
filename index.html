<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACAG Login</title>
<style>
  :root{
    --bg:#12161c;
    --panel:#1b212b;
    --line:#2a3140;
    --text:#e7ebf0;
    --muted:#8a93a3;
    --accent:#4f8cff;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:32px;
  }
  .card h1{
    font-size:20px;
    margin:0 0 4px;
  }
  .card p.sub{
    margin:0 0 24px;
    color:var(--muted);
    font-size:14px;
  }
  label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:var(--muted);
  }
  input{
    width:100%;
    padding:10px 12px;
    margin-bottom:16px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#10141a;
    color:var(--text);
    font-size:14px;
  }
  input:focus{
    outline:none;
    border-color:var(--accent);
  }
  button{
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:6px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{ opacity:0.9; }
  .error{
    color:var(--danger);
    font-size:13px;
    margin:-8px 0 16px;
    min-height:16px;
  }
  .dashboard{ display:none; text-align:center; }
  .dashboard h2{ margin-bottom:8px; }
  .dashboard p{ color:var(--muted); font-size:14px; margin-bottom:20px; }
  .logout-btn{ background:var(--danger); }
</style>
</head>
<body>

<div class="card" id="loginCard">
  <h1>Sign in</h1>
  <p class="sub">Enter your username and password</p>
  <label for="username">Username</label>
  <input id="username" type="text" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="error" id="errorMsg"></div>
  <button id="loginBtn">Sign in</button>
</div>

<div class="card dashboard" id="dashboardCard">
  <h2 id="welcomeText">Welcome</h2>
  <p id="roleText"></p>
  <button class="logout-btn" id="logoutBtn">Log out</button>
</div>

<script>
// =============================================
// USER STORE (persisted to localStorage)
// =============================================
function loadUsers(){
  const stored = localStorage.getItem('acag_users_v3');
  if(stored) return JSON.parse(stored);
  // Default users
  const defaults = [
    {username:'admin', password:'acag2026', role:'admin', blocked:false, createdAt: new Date().toISOString()},
    {username:'user',  password:'user1122', role:'user',  blocked:false, createdAt: new Date().toISOString()}
  ];
  saveUsers(defaults);
  return defaults;
}
function saveUsers(users){
  localStorage.setItem('acag_users_v3', JSON.stringify(users));
}
let USERS = loadUsers();

// =============================================
// FORCE LOGOUT ON EVERY PAGE VISIT/RELOAD
// =============================================
(function forceLogoutOnLoad(){
  localStorage.removeItem('acag_current_user');
  sessionStorage.clear();
})();

// =============================================
// LOGIN / LOGOUT LOGIC
// =============================================
const loginCard = document.getElementById('loginCard');
const dashboardCard = document.getElementById('dashboardCard');
const errorMsg = document.getElementById('errorMsg');

document.getElementById('loginBtn').addEventListener('click', () => {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  errorMsg.textContent = '';

  const found = USERS.find(u => u.username === username && u.password === password);

  if(!found){
    errorMsg.textContent = 'Invalid username or password.';
    return;
  }
  if(found.blocked){
    errorMsg.textContent = 'This account is blocked.';
    return;
  }

  // Session is intentionally kept in sessionStorage only (cleared on every page load/refresh)
  sessionStorage.setItem('acag_current_user', JSON.stringify({username: found.username, role: found.role}));
  showDashboard(found);
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('acag_current_user');
  loginCard.style.display = 'block';
  dashboardCard.style.display = 'none';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
});

function showDashboard(user){
  loginCard.style.display = 'none';
  dashboardCard.style.display = 'block';
  document.getElementById('welcomeText').textContent = 'Welcome, ' + user.username;
  document.getElementById('roleText').textContent = 'Role: ' + user.role;
}
</script>

</body>
</html>
