<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apni Chhat Mehfooz Chhat — Member Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --navy:#1f4e79;
  --navy-dark:#173a5c;
  --navy-light:#2f6f9f;
  --gold:#c59d5f;
  --gold-dark:#a98248;
  --gold-light:#dfc38f;
  --bg:#f3f5f7;
  --card:#ffffff;
  --text:#333333;
  --text-soft:#7b8794;
  --border:#dfe3e8;
  --success:#28a745;
  --error:#dc3545;
  --warning:#f0ad4e;
}

body{
  font-family:'Inter', Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

.masthead{
  background:var(--navy);
  padding:0;
}
.masthead-inner{
  max-width:980px; margin:0 auto;
  padding:26px 24px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between;
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand-mark{
  width:46px; height:46px; border-radius:10px;
  background:linear-gradient(135deg, var(--gold), var(--gold-light));
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; color:#fff; flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,0.2);
}
.brand-text h1{ color:#fff; font-size:1.35rem; font-weight:700; }
.brand-text p{ color:var(--gold-light); font-size:0.85rem; margin-top:2px; }

main{ max-width:980px; margin:0 auto; padding:34px 24px 90px; }

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:0 4px 18px rgba(0,0,0,0.06);
  padding:28px;
  margin-bottom:22px;
}

/* Status card */
.status-card{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  flex-wrap:wrap;
}
.status-info{ display:flex; align-items:center; gap:16px; }
.status-icon{
  width:52px; height:52px; border-radius:12px;
  background:#eef3f8; border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:1.4rem;
  flex-shrink:0;
}
.status-text h3{ color:var(--navy); font-size:1rem; font-weight:700; margin-bottom:3px; }
.status-text p{ color:var(--text-soft); font-size:0.85rem; font-family:'Courier New',monospace; }

.badge{
  padding:8px 16px; border-radius:100px; font-size:0.82rem; font-weight:700;
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.badge.loading{ background:#eaf1f8; color:var(--navy); border:1px solid #cddcea; }
.badge.success{ background:#e8f6ec; color:var(--success); border:1px solid #c5e8cf; }
.badge.error{ background:#fbeaea; color:var(--error); border:1px solid #f0c4c4; }
.spinner{ width:13px; height:13px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.status-actions{ display:flex; gap:10px; align-items:center; }
.btn-refresh{
  padding:9px 16px; background:#fff; border:1.4px solid var(--navy); color:var(--navy);
  border-radius:8px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:all 0.2s;
}
.btn-refresh:hover{ background:var(--navy); color:#fff; }

/* Search card */
.card-title{
  color:var(--navy); font-size:1.25rem; font-weight:700; margin-bottom:20px;
  display:flex; align-items:center; gap:10px;
}
.search-row{ display:flex; gap:14px; flex-wrap:wrap; }
.input-group{ flex:1 1 260px; }
label{ display:block; font-size:0.88rem; font-weight:600; margin-bottom:8px; color:var(--navy); }
input[type="text"]{
  width:100%; padding:14px 16px; font-size:1rem; font-family:'Courier New',monospace; font-weight:600;
  background:#f8fafb; border:1.5px solid var(--border); border-radius:8px; color:var(--text);
  transition:all 0.2s;
}
input[type="text"]:focus{
  outline:none; border-color:var(--navy); background:#fff;
  box-shadow:0 0 0 3px rgba(31,78,121,0.12);
}
input[type="text"]::placeholder{ color:#a0a5aa; font-family:'Inter',sans-serif; font-weight:400; }

button.search-btn{
  align-self:flex-end; padding:14px 32px;
  background:var(--navy); color:#fff; border:none; border-radius:8px;
  font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s;
  box-shadow:0 3px 12px rgba(31,78,121,0.3); white-space:nowrap;
}
button.search-btn:hover:not(:disabled){ background:var(--navy-dark); transform:translateY(-1px); }
button.search-btn:disabled{ opacity:0.6; cursor:not-allowed; }

/* Results */
.results-header{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;
}
.results-header h2{ color:var(--navy); font-size:1.2rem; font-weight:700; }
.results-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.action-btn{
  padding:9px 16px; background:#fff; border:1.4px solid var(--border);
  border-radius:8px; color:var(--navy); font-weight:600; font-size:0.83rem; cursor:pointer; transition:all 0.2s;
}
.action-btn:hover{ background:#f3f6f9; border-color:var(--navy); }
.count{ color:var(--text-soft); font-weight:600; font-size:0.9rem; }

.table-wrapper{ overflow-x:auto; border-radius:8px; border:1px solid var(--border); }
table{ width:100%; border-collapse:collapse; }
thead{ background:linear-gradient(135deg, var(--navy), var(--navy-dark)); }
th{
  padding:14px 16px; text-align:left; font-size:0.78rem; font-weight:800;
  color:var(--gold-light); text-transform:uppercase; letter-spacing:0.6px; white-space:nowrap;
}
tbody tr{ border-bottom:1px solid var(--border); transition:background 0.2s; }
tbody tr:hover{ background:#f6f8fa; }
tbody tr:last-child{ border-bottom:none; }
td{ padding:14px 16px; font-size:0.9rem; color:var(--text); white-space:nowrap; }
td.mono{ font-family:'Courier New',monospace; color:var(--navy); font-weight:600; }

.state{ padding:70px 30px; text-align:center; }
.state-icon{ font-size:2.6rem; margin-bottom:16px; }
.state h3{ color:var(--navy); font-size:1.2rem; font-weight:700; margin-bottom:8px; }
.state p{ color:var(--text-soft); font-size:0.95rem; }
.loading-icon{
  width:44px; height:44px; margin:0 auto 18px;
  border:4px solid var(--border); border-top-color:var(--navy); border-right-color:var(--gold);
  border-radius:50%; animation:spin 0.9s linear infinite;
}

footer{ text-align:center; padding:26px; color:#9aa3ac; font-size:0.8rem; }
footer a{ color:var(--navy); text-decoration:underline; }

@media(max-width:640px){
  .search-row{ flex-direction:column; }
  button.search-btn{ width:100%; }
  .results-header{ flex-direction:column; align-items:flex-start; }
  th,td{ padding:10px 12px; font-size:0.82rem; }
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <div class="brand-mark">🏠</div>
      <div class="brand-text">
        <h1>Apni Chhat Mehfooz Chhat</h1>
        <p>Member Search System</p>
      </div>
    </div>
  </div>
</header>

<main>

  <div class="card status-card">
    <div class="status-info">
      <div class="status-icon">📊</div>
      <div class="status-text">
        <h3>Database Connection</h3>
        <p id="statusInfo">Initializing connection…</p>
      </div>
    </div>
    <div class="status-actions">
      <button class="btn-refresh" id="refreshBtn" onclick="forceRefresh()">🔄 Refresh</button>
      <div class="badge loading" id="statusBadge"><span class="spinner"></span><span>Loading</span></div>
    </div>
  </div>

  <div class="card">
    <h2 class="card-title">🔍 Search by CNIC</h2>
    <div class="search-row">
      <div class="input-group">
        <label>Enter CNIC Number</label>
        <input type="text" id="cnicInput" placeholder="XXXXX-XXXXXXX-X" maxlength="15" autocomplete="off">
      </div>
      <button class="search-btn" id="searchBtn" onclick="search()">
        <span id="btnText">🔍 Search</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="results-header">
      <h2>Search Results</h2>
      <div class="results-actions">
        <button class="action-btn" onclick="copyResults()">📋 Copy</button>
        <button class="action-btn" onclick="exportExcel()">📊 Excel</button>
        <button class="action-btn" onclick="printResults()">🖨️ Print</button>
      </div>
      <div class="count" id="resultCount">Ready to search</div>
    </div>
    <div class="table-wrapper">
      <table>
        <tbody id="results">
          <tr>
            <td colspan="7" class="state">
              <div class="state-icon">🔍</div>
              <h3>Ready to Search</h3>
              <p>Enter a 13-digit CNIC above and press Search</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<footer>Data source: <a href="https://docs.google.com/spreadsheets/d/1v9Y7EulDlF4xlsp_1WVsIsNeVWNrOEti/edit" target="_blank" rel="noopener">connected Google Sheet</a> · read-only lookup</footer>

<script>
// =============================================
// CONFIG
// =============================================
const SHEET_ID = "1v9Y7EulDlF4xlsp_1WVsIsNeVWNrOEti";
const SHEET_NAME = "Sheet1";
const COLUMNS = ['Sr No','CNIC','Name','Contact','Branch Name','Branch Code','Batch'];

let sheetData = [];
let ready = false;
let currentResults = [];

// =============================================
// CSV PARSE
// =============================================
function parseCSV(csv){
  const lines = csv.split("\n").filter(l => l.trim());
  const rows = [];
  for(let i=0;i<lines.length;i++){
    const line=lines[i]; const cells=[]; let cell=''; let quoted=false;
    for(let j=0;j<line.length;j++){
      const c=line[j]; const next=line[j+1];
      if(c==='"'){ if(quoted && next==='"'){ cell+='"'; j++; } else { quoted=!quoted; } }
      else if(c===',' && !quoted){ cells.push(cell.trim()); cell=''; }
      else{ cell+=c; }
    }
    cells.push(cell.trim());
    rows.push(cells);
  }
  return rows;
}

async function fetchSheetCSV(){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 30000);
  try{
    const res = await fetch(url, { method:'GET', cache:'no-cache', mode:'cors', signal: controller.signal });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error("Connection failed");
    return await res.text();
  } finally {
    clearTimeout(timeoutId);
  }
}

async function loadData(isBackground){
  const badge = document.getElementById("statusBadge");
  const info = document.getElementById("statusInfo");
  try{
    if(!isBackground){
      badge.className = "badge loading";
      badge.innerHTML = '<span class="spinner"></span><span>Connecting</span>';
      info.textContent = "Connecting to Google Sheets…";
    }
    const start = performance.now();
    const csv = await fetchSheetCSV();
    const rows = parseCSV(csv);
    const time = Math.round(performance.now() - start);
    sheetData = rows;
    ready = true;
    const count = sheetData.length - 1;
    badge.className = "badge success";
    badge.innerHTML = '<span>✓</span><span>Connected</span>';
    info.innerHTML = `<strong>${count.toLocaleString()}</strong> records loaded in <strong>${time}ms</strong>`;
    setTimeout(() => { badge.innerHTML = `<span>✓</span><span>${count.toLocaleString()} Records</span>`; }, 2000);
  }catch(err){
    ready = false;
    badge.className = "badge error";
    if(err.name === 'AbortError'){
      badge.innerHTML = '<span>⚠</span><span>Timeout</span>';
      info.textContent = "Connection timed out after 30 seconds.";
    }else{
      badge.innerHTML = '<span>⚠</span><span>Failed</span>';
      info.textContent = "Connection failed. Check sheet sharing (Anyone with link – Viewer) and press Refresh.";
    }
    console.error(err);
  }
}

async function forceRefresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '🔄 Refreshing…';
  await loadData(false);
  btn.disabled = false; btn.textContent = '🔄 Refresh';
}

// =============================================
// SEARCH
// =============================================
function search(){
  if(!ready){ showError("Database not loaded yet. Please wait…"); return; }
  const input = document.getElementById("cnicInput").value.trim();
  const btn = document.getElementById("searchBtn");
  const btnText = document.getElementById("btnText");
  const count = document.getElementById("resultCount");
  const cnic = input.replace(/\D/g, "");
  if(cnic.length !== 13){ showError("Please enter a valid 13-digit CNIC"); return; }

  btn.disabled = true; btnText.textContent = "⏳ Searching"; showLoading();

  requestAnimationFrame(() => {
    setTimeout(() => {
      try{
        const start = performance.now();
        const results = [];
        const rows = sheetData.slice(1);
        for(let i=0;i<rows.length;i++){
          const rowCnic = (rows[i][1] || '').replace(/\D/g, "");
          if(rowCnic === cnic) results.push(rows[i]);
        }
        const time = Math.round(performance.now() - start);
        btn.disabled = false; btnText.textContent = "🔍 Search";
        if(results.length === 0){
          showNoResults();
          count.textContent = "No results found";
        }else{
          currentResults = results;
          showResults(results);
          count.textContent = `${results.length} record(s) found in ${time}ms`;
        }
      }catch(err){
        btn.disabled = false; btnText.textContent = "🔍 Search";
        showError("Search failed. Please try again.");
      }
    }, 50);
  });
}

// =============================================
// DISPLAY
// =============================================
function showLoading(){
  document.getElementById("results").innerHTML = `<tr><td colspan="7" class="state"><div class="loading-icon"></div><h3>Searching Database…</h3><p>Please wait</p></td></tr>`;
}
function showNoResults(){
  document.getElementById("results").innerHTML = `<tr><td colspan="7" class="state"><div class="state-icon">❌</div><h3>No Results Found</h3><p>No matching CNIC found</p></td></tr>`;
}
function showError(msg){
  document.getElementById("results").innerHTML = `<tr><td colspan="7" class="state"><div class="state-icon">⚠️</div><h3>Notice</h3><p>${msg}</p></td></tr>`;
  document.getElementById("resultCount").textContent = "—";
}
function showResults(results){
  let html = `<tr>${COLUMNS.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  results.forEach(r => {
    html += `<tr>${r.slice(0,7).map((v,i)=>`<td${i===1?' class="mono"':''}>${v || "-"}</td>`).join('')}</tr>`;
  });
  document.getElementById("results").innerHTML = html;
}

// =============================================
// EXPORT
// =============================================
function copyResults(){
  if(currentResults.length === 0){ alert('No results to copy'); return; }
  let text = COLUMNS.join('\t') + '\n';
  currentResults.forEach(r => { text += r.slice(0,7).join('\t') + '\n'; });
  navigator.clipboard.writeText(text).then(() => alert('✓ Results copied')).catch(() => alert('Failed to copy'));
}
function exportExcel(){
  if(currentResults.length === 0){ alert('No results to export'); return; }
  if(typeof XLSX === 'undefined'){ alert('Export library not loaded.'); return; }
  const ws = XLSX.utils.aoa_to_sheet([COLUMNS, ...currentResults]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Search Results');
  XLSX.writeFile(wb, `Member_Search_Results_${Date.now()}.xlsx`);
}
function printResults(){
  if(currentResults.length === 0){ alert('No results to print'); return; }
  const w = window.open('', '', 'height=600,width=800');
  w.document.write('<html><head><title>Member Search Results</title>');
  w.document.write('<style>body{font-family:Arial;padding:20px;}h2{margin-bottom:10px;color:#1f4e79;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:10px;}th{background:#1f4e79;color:#dfc38f;}</style>');
  w.document.write('</head><body><h2>Apni Chhat Mehfooz Chhat — Member Search Results</h2>');
  w.document.write(`<p>Generated: ${new Date().toLocaleString()}</p>`);
  w.document.write(`<table><thead><tr>${COLUMNS.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`);
  currentResults.forEach(r => { w.document.write(`<tr>${r.slice(0,7).map(v=>`<td>${v||''}</td>`).join('')}</tr>`); });
  w.document.write('</tbody></table></body></html>');
  w.document.close(); w.print();
}

// =============================================
// INPUT FORMATTING
// =============================================
document.getElementById("cnicInput").addEventListener("input", e => {
  let v = e.target.value.replace(/\D/g, "").slice(0, 13);
  if(v.length > 5) v = v.slice(0,5) + "-" + v.slice(5);
  if(v.length > 13) v = v.slice(0,13) + "-" + v.slice(13);
  e.target.value = v;
});
document.getElementById("cnicInput").addEventListener("keypress", e => { if(e.key === "Enter") search(); });

// =============================================
// INIT
// =============================================
loadData(false);
</script>
</body>
</html>
