<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACAG Application</title>
  <style>
    /* basic app styling */
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; max-width: 400px; margin: 50px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #0056b3; }
    .error { color: red; display: none; margin-top: 10px; font-size: 14px; }
    .error.show { display: block; }
    #appContent { display: none; text-align: center; }
  </style>
</head>
<body>

  <!-- LOGIN CONTAINER -->
  <div id="loginContainer" class="card">
    <h2>System Login</h2>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>
    <div class="form-group">
      <label><input type="checkbox" id="rememberMe"> Remember Me</label>
    </div>
    <button onclick="login()">Login</button>
    <div id="loginError" class="error"></div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContent" class="card">
    <h2 id="welcomeHeading">Welcome!</h2>
    <p>You have successfully logged in.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    // Global User State
    let currentUser = null;
    let currentUserRole = null;
    let USERS = [];

    // 1. Users Manager Logic
    function loadUsers(){
      const stored = localStorage.getItem('acag_users_v2');
      let usersList = stored ? JSON.parse(stored) : [];

      // Purane 'user' ko system list se remove karna
      usersList = usersList.filter(u => u.username !== 'user');

      // Naye 'user001' ko add karna
      const hasUser001 = usersList.some(u => u.username === 'user001');
      if (!hasUser001) {
        usersList.push({
          username: 'user001',
          password: 'user123',
          role: 'user',
          blocked: false,
          createdAt: new Date().toISOString()
        });
      }

      // Default Admin account check
      if (!usersList.some(u => u.username === 'admin')) {
        usersList.push({
          username: 'admin',
          password: 'acag2026',
          role: 'admin',
          blocked: false,
          createdAt: new Date().toISOString()
        });
      }

      saveUsers(usersList);
      return usersList;
    }

    function saveUsers(list) {
      localStorage.setItem('acag_users_v2', JSON.stringify(list));
    }

    // Initialize Users Array
    USERS = loadUsers();

    // 2. Login Functionality
    function login(){
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const errorEl = document.getElementById('loginError');

      errorEl.classList.remove('show');
      
      if(!username || !password){
        errorEl.textContent = '⚠️ Please enter both username and password';
        errorEl.classList.add('show');
        return;
      }

      // Purane "user" username ko block karna
      if(username === "user") {
        errorEl.textContent = '🚫 This account has been disabled. Please login with "user001"';
        errorEl.classList.add('show');
        return;
      }

      // User Authentication Check
      const account = USERS.find(u => u.username === username && u.password === password);

      if (!account) {
        errorEl.textContent = '❌ Invalid username or password';
        errorEl.classList.add('show');
        return;
      }

      if (account.blocked) {
        errorEl.textContent = '🚫 Your account is blocked. Contact administrator.';
        errorEl.classList.add('show');
        return;
      }

      // Session Login Logic
      currentUser = account.username;
      currentUserRole = account.role;

      if (rememberMe) {
        localStorage.setItem('acag_user_persistent', currentUser);
      } else {
        sessionStorage.setItem('acag_user', currentUser);
      }

      logActivity('🔑', `User ${currentUser} logged in successfully`);
      showApp();
    }

    // 3. UI Display Handlers
    function showApp() {
      document.getElementById('loginContainer').style.display = 'none';
      document.getElementById('appContent').style.display = 'block';
      document.getElementById('welcomeHeading').textContent = `Welcome, ${currentUser}! (${currentUserRole})`;
    }

    function logout() {
      localStorage.removeItem('acag_user_persistent');
      sessionStorage.removeItem('acag_user');
      location.reload();
    }

    function logActivity(icon, message) {
      console.log(`${icon} Activity: ${message}`);
    }

    // 4. Initial Window Load & Auto-Logout Check
    window.onload = () => {
      const persistentUser = localStorage.getItem('acag_user_persistent');
      const sessionUser = sessionStorage.getItem('acag_user');

      // Purane "user" ka active session auto-clear karna
      if (persistentUser === 'user' || sessionUser === 'user') {
        localStorage.removeItem('acag_user_persistent');
        sessionStorage.removeItem('acag_user');
        alert("Purana 'user' account disable kar diya gaya hai. Meharbani karke 'user001' se login karein.");
        location.reload();
        return;
      }

      if(persistentUser){
        const u = USERS.find(x => x.username === persistentUser);
        if(u && !u.blocked){
          currentUser = persistentUser;
          currentUserRole = u.role;
          showApp();
          return;
        } else {
          localStorage.removeItem('acag_user_persistent');
        }
      }

      if(sessionUser){
        const u = USERS.find(x => x.username === sessionUser);
        if(u && !u.blocked){
          currentUser = sessionUser;
          currentUserRole = u.role;
          showApp();
          return;
        } else {
          sessionStorage.removeItem('acag_user');
        }
      }
      
      document.getElementById('username').focus();
    };
  </script>
</body>
</html>
